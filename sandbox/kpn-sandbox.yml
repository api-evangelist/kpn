mock_server_note: SwaggerHub auto-mocking servers are declared as the first servers[] entry in seven definitions,
  giving a schema-accurate response without credentials.
test_values:
  published: false
  note: KPN publishes no magic test MSISDNs, test cards or fixture identifiers. Example values that appear in the
    specifications (for example sender 31600000000 / recipient 3197000000000 on the inbound SMS payload) are documentation
    examples, not reserved test numbers.
tooling:
