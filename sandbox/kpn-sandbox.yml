model:
  separation: account-tier, not key-prefix
  description: Every registered developer account starts in test mode. The same client_id/client_secret pair is
    used, and a project stays free until the account is upgraded to production; there is no separate test key prefix
    and no separate sandbox hostname - the KPN specifications describe the sandbox as "Full-fledged capabilities".
  promotion: Upgrade to production requires a KPN Registration Number (KRN) or an iDIN bank identity check. Billing
    starts at promotion; testing products remain free.
free_tier:
  cost: free
  limits: per-API request limits, described as enough for thorough testing; additional free test requests can be
    requested through support
