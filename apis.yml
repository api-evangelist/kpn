- aid: kpn:kpn-webhook-signing-keys
  name: KPN Webhook Signing Keys API
  description: 'When KPN delivers a webhook to your endpoint, signing keys are to know the request genuinely
    came from KPN and wasn''t tampered with in transit. KPN signs every outbound webhook payload using
    HMAC-SHA256 and includes the signature in a header. You store a shared secret on your side, compute
    the expected signature over the incoming request body, and compare it to the header value. If they
    match, the payload is genuine. This API lets you create and manage those shared secrets. **How signing
    keys work** You can set a signing key at three levels — Organization, Team, or Application. When KPN
    delivers a webhook, it picks the active key starting at the most specific level (Application), falling
    back to Team, then Organization. KPN automatically provisions an organization-level key on your first
    webhook delivery if you haven''t created one. Each key moves through a simple lifecycle: -...'
  humanURL: https://app.swaggerhub.com/apis-docs/kpn/webhook-signing-key-management-kpn
  tags:
  - Webhooks
  - Security
  - Key Management
  properties:
  - type: APIReference
    url: https://app.swaggerhub.com/apis-docs/kpn/webhook-signing-key-management-kpn
  - type: OpenAPI
    url: openapi/kpn-webhook-signing-keys-openapi.yml
  baseURL: https://api-prd.kpn.com/webhookconfigs-kpn
- aid: kpn:kpn-webhook-privacy-config-manager
  name: KPN Webhook Privacy Config Manager API
  description: 'KPN delivers outbound webhook notifications — such as SMS delivery reports — to the endpoints
    you configure. This API lets you control two things about those deliveries: the URL they are sent
    to, and which fields are included in the payload. **How configuration scopes work** You can configure
    webhooks at three levels — Organization, Team, or Application. Settings resolve from the most specific
    level to the broadest: an Application config overrides a Team config, which overrides the Organization
    config. This lets you set sensible defaults at org or team level and override them only where a specific
    application needs it. **Controlling payload fields (privacy)** `privacy_config.excluded_fields` maps
    a service name to the list of fields to omit from that service''s outbound payloads. Any field not
    listed is included; an empty or absent map means every field is sent. Exclusion rules...'
  humanURL: https://app.swaggerhub.com/apis-docs/kpn/webhook-privacy-config-manager
  tags:
  - Webhooks
