- aid: kpn:kpn-high-level-design-ftth
  name: KPN High Level Design FttX API
  description: 'The High-Level Design FTTx API supports Fiber to the Home (FTTH) engineering jobs. It
    allows you to calculate the required work and cost for Fiber rollout in a provided region. Run the
    endpoints in this order: 1. **POST /startJobS3** to retrieve a signed URL for Amazon S3 bucket. Send
    this URL using the following endpoint. 2. **PUT /s3url_uploads/{jsonFileNameAndExtension}** to upload
    the job. 3. **GET /jobStatus/{jobId}** to retrieve the status of the job. 4. **GET / jobResultS3/{jobId}**
    to retrieve a signed URL for the Amazon Simple Storage Service (Amazon S3) bucket. Send this URL using
    the following endpoint. 5. **GET /Output/{jsonFileNameAndExtension}** to retrieve the results of the
    engineering job.'
  humanURL: https://developer.kpn.com/products/kpn-high-level-design-fttx-api
