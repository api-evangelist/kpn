apis:
- aid: kpn:kpn-grip
  name: KPN GRIP API
  description: >-
    KPN Grip is a KPN identity and access management solution that acts as a central identity hub, letting
    developers integrate user registration, authentication and authorization (SAML 2.0, OpenID Connect,
    OAuth 2) and password reset into their own applications. The user API is served from https://api.grip-on-it.com/users/
    and the OIDC/SAML surfaces from https://auth.grip-on-it.com/; tokens are obtained with an OAuth 2.0
    client-credentials POST to https://auth.grip-on-it.com/v2/{tenant.id}/oidc/idp/token. No public OpenAPI
    definition is published for GRIP on KPN's SwaggerHub organisation as of the harvest date.
  humanURL: https://developer.kpn.com/products/kpn-grip-api
  tags:
  - Security
  - Identity
  - Access Management
  properties:
  - type: Documentation
    url: https://developer.kpn.com/products/kpn-grip-api
  - type: APIReference
    url: https://developer.kpn.com/documentation/kpn-grip-api-documentation
  - type: AuthorizationServer
    url: https://auth.grip-on-it.com/
  baseURL: https://api.grip-on-it.com/users/
- aid: kpn:kpn-pim-id
  name: KPN PIM ID API
  description: >-
    KPN PiM ID generates tamper-proof, company-specific encrypted QR codes from validated customer data
    (POST /image on https://api-prd.kpn.com/kpn/qrcodegenerator). The codes are embedded in surfaces such
    as login pages and scanned with the PiM mobile application to authenticate a customer. Authentication
    is OAuth 2.0 client_id/client_secret. No public OpenAPI definition is published for PiM ID on KPN's
    SwaggerHub organisation as of the harvest date.
  humanURL: https://developer.kpn.com/products/kpn-pim-id-api
  tags:
  - Identity
  - Verification
  - Mobile
  properties:
  - type: Documentation
    url: https://developer.kpn.com/products/kpn-pim-id-api
  - type: APIReference
    url: https://developer.kpn.com/documentation/kpn-pim-id-api-documentation
  baseURL: https://api-prd.kpn.com/kpn/qrcodegenerator
