aid: kpn
url: https://raw.githubusercontent.com/api-evangelist/kpn/refs/heads/main/apis.yml
name: KPN
kind: company
description: 'Koninklijke KPN N.V. is the incumbent telecommunications and IT provider of the Netherlands,
  operating the country''s national fixed (copper and fibre) and mobile networks and selling telephony, broadband,
  television, IoT connectivity and managed IT services to consumers, businesses and — through KPN Wholesale
  — to other operators. In the telecom API value chain KPN sits on the network-operator side, but it is a conspicuous
  exception to the carrier norm: rather than routing developers exclusively through aggregators, KPN runs a
  genuine self-serve developer portal at developer.kpn.com where anyone can register a free account, get a
  client ID and secret, test in a sandbox at no cost, and see per-transaction pricing, then upgrade to production
  via a KRN company number or an iDIN identity check. Thirty-four OpenAPI/Swagger definitions are published
  anonymously downloadable under KPN''s public SwaggerHub organisation, all fronted by an Apigee-style gateway
  at api-prd.kpn.com with OAuth 2.0 client-credentials. KPN is listed in the official CAMARA landscape as an
  operator and, with Odido and Vodafone under the COIN association and GSMA Open Gateway, launched CAMARA-standard
  fraud-prevention APIs for the Dutch market in October 2025; its SIM Swap definition points explicitly at
  github.com/camaraproject as its product documentation. KPN is not an Aduna shareholder and does not reach
  developers through that JV. Notably, KPN also resells Vonage and Apidaze CPaaS products through its own portal
  — the aggregator layer appearing inside the carrier''s own catalogue rather than the other way round.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
