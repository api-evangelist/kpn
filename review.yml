actions:
  apisYmlCreated: true
  apisListed: 38
  openapiHarvested: 34
  openapiDirectory: openapi/
  note: >-
    38 apis[] entries: 34 backed by a harvested OpenAPI/Swagger definition, plus 4 products
    (GRIP, PIM ID, SMS Campaigns, Email-to-SMS) that are documented on the portal at HTTP 200
    but have no public machine-readable definition. Nothing was invented; every humanURL and
    APIReference was probed and returned 200 (SwaggerHub reference pages return 302 to their
    versioned SPA route).
