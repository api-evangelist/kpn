certifications:
  published_for_the_api_platform: false
  note: No trust centre, SOC 2, ISO 27001 or PCI attestation is published for the KPN Developer platform. KPN certifications
    that are published sit with other business units - for example the KPN Registration Authority (PKIoverheid /
    eIDAS trust services) states ISO 9001:2015 and ISO 27001:2013 certification in its Practices Statement at https://certificaat.kpn.com/files/CPS/
