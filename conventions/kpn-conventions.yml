idempotency:
  supported: false
  evidence: No Idempotency-Key (or equivalent) parameter appears in any of the 34 published definitions, and the
    developer documentation defines no retry-safety contract for write operations.
  note: Webhook delivery retries are at-least-once (4 attempts at 0/60/120/240s), so receivers must de-duplicate
    on message_id themselves.
