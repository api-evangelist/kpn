notes:
- Number Verify and Match additionally expose their own POST /token operation layered on top of the gateway token.
- 'The FIAM Eneco Data Products API is the one estate exception: it authenticates with an Apigee apikey request
  header instead of OAuth.'
- Tokens expire; the webhook configuration APIs explicitly instruct clients to refresh before expiry. KPN does not
  publish the token lifetime.
- 'KPN GRIP is the one product with a full identity stack of its own: it issues tokens from its own tenant-scoped
  authorization server at auth.grip-on-it.com and speaks SAML 2.0, OpenID Connect and OAuth 2 to relying parties.
  Anonymous /.well-known/openid-configuration is not served - discovery is tenant-scoped.'
