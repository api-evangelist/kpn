  class: delivery
- code: '016'
  meaning: Malformed request or invalid submission
  class: content
- code: '017'
  meaning: Invalid message parameter or encoding issue
  class: content
- code: 018
  meaning: Blocked by anti-spam or safeguard controls
  class: content
- code: 019
  meaning: Content not permitted
  class: content
- code: '020'
  meaning: Insufficient credit/quota
  class: policy-or-quota
- code: '021'
  meaning: Blocked due to age or parental restrictions
  class: policy-or-quota
- code: '022'
