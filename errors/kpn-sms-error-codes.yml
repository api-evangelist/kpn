api: openapi/kpn-sms-openapi.yml
scope: Product-level SMS failure codes returned on the delivery-report webhook (sms_dlr). These are distinct from
  the HTTP-level errors catalogued in errors/kpn-problem-types.yml.
envelope: Delivery-report webhook payload; carried alongside the delivery status code (1 Delivered, 2 Queued, 3
  Accepted, 4 Failed, 5 Rejected, 6 Expired).
delivery_statuses:
- code: 1
  meaning: Delivered
- code: 2
  meaning: Queued
- code: 3
  meaning: Accepted
- code: 4
  meaning: Failed
- code: 5
  meaning: Rejected
- code: 6
  meaning: Expired
error_codes:
- code: '001'
  meaning: Unknown or unspecified error
  class: delivery
- code: '002'
  meaning: Recipient number/subscriber is unknown or invalid
  class: delivery
- code: '003'
  meaning: Recipient is barred, blocked, illegal, suspended
  class: delivery
- code: '004'
  meaning: Recipient has opted out or requested not to receive
  class: delivery
- code: '005'
  meaning: Recipient/network/device cannot receive SMS
  class: delivery
- code: '006'
  meaning: Recipient handset is temporarily unavailable or busy
  class: delivery
- code: '007'
  meaning: Recipient is temporarily unreachable or out of coverage
  class: delivery
- code: 008
  meaning: Recipient deregistered or permanently unavailable
  class: delivery
- code: 009
  meaning: Temporary handset/SIM/storage issue
  class: delivery
- code: '010'
  meaning: Permanent handset/SIM/device issue
  class: delivery
- code: '011'
  meaning: Network/system/operator failure
  class: delivery
- code: '012'
  meaning: Delivery failed due to number portability issue
  class: delivery
- code: '013'
  meaning: Provider could not find suitable internal route
  class: delivery
- code: '014'
  meaning: No delivery route could be found
  class: delivery
- code: '015'
