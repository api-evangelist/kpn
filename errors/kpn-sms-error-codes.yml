- code: '030'
  meaning: Unexpected regulatory/compliance error
  class: regulatory
notes:
- Codes 026-030 are regulatory/DLT (Distributed Ledger Technology registration) compliance failures that apply to
  markets with sender-registration regimes.
- 'Retry behaviour: KPN attempts webhook delivery 4 times at 0/60/120/240 seconds.'
