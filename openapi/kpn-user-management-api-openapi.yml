openapi: 3.2.0
info:
  description: 'This API offers three functionalities:

    - User management

    - Emailing


    User management can be used to add, get and modify user information.'
  version: v.1.1.1
  title: Registered E-mail - Registered E-mail User Management API
  contact:
    name: API Support
    email: api_developer@kpn.com
    url: https://developer.kpn.com/support
  termsOfService: https://developer.kpn.com/legal
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/kpn/registeredemail-registeredemail/v.1.1.1
- url: https://api-prd.kpn.com/data/registeredemail/registeredemail
tags:
- name: User Management
paths:
  /api/user/:
    post:
      tags:
      - User Management
      description: This endpoint creates a new user (with role user).
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/api_version'
      requestBody:
        $ref: '#/components/requestBodies/CreateUser'
      responses:
        201:
          $ref: '#/components/responses/UserCreated'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        429:
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      summary: Create api user
      x-summary-source: derived
      operationId: postApiUser
      x-operation-id-source: derived
components:
  responses:
    UserCreated:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserInfo'
  requestBodies:
    CreateUser:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email_address:
                type: string
                format: email
            required:
            - email_address
  schemas:
    id:
      type: integer
      example: 154
    error:
      type: object
      properties:
        transactionId:
          type: string
          description: Transaction id of the the request
          title: Transaction ID
        status:
          type: string
          description: Status
          title: Status
        name:
          type: string
          description: Error name
          title: Error name
        message:
          type: string
          description: Error message
          title: Error message
        info:
          type: string
          description: Additional information about error
          title: Info
    UserInfo:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
      required:
      - id
  parameters:
    api_version:
      in: header
      name: api-version
      schema:
        type: string
      description: API Version. If no version is provided it defaults to latest version.
      required: false
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api-prd.kpn.com/oauth/client_credential/accesstoken?grant_type=client_credentials
externalDocs:
  description: HTTP response headers
  url: https://developer.kpn.com/documentation-response-headers
