    post:
      description: Swap which profile an eSIM uses.
      operationId: createOrganizationCellularGatewayEsimsSwap
      parameters:
      - name: organizationId
        in: path
        description: Organization ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                swaps:
                  type: array
                  items:
                    type: object
                    properties:
                      eid:
                        type: string
                        description: eSIM EID
                      target:
                        type: object
                        properties:
                          accountId:
                            type: string
                            description: ID of the target account; can be the account currently tied to the eSIM
                          communicationPlan:
                            type: string
                            description: Name of the target communication plan
                          ratePlan:
                            type: string
                            description: Name of the target rate plan
                        required:
                        - accountId
                        - communicationPlan
                        - ratePlan
                        description: Target Profile attributes
                    required:
                    - eid
                  description: Each object represents a swap for one eSIM
              example:
                swaps:
                - eid: '1234567890'
                  target:
                    accountId: '456'
                    communicationPlan: A comm plan
                    ratePlan: A rate plan
              required:
              - swaps
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  eid:
                    type: string
                    description: eSIM EID
                  iccid:
                    type: string
                    description: eSIM ICCID
                  status:
                    type: string
                    enum:
                    - Completed
                    - Failed
                    - In progress
                    description: Swap status
                required:
                - eid
                - iccid
                - status
              example:
                eid: '1234567890'
                iccid: '9876543210'
                status: Completed
      summary: Swap which profile an eSIM uses.
      tags:
      - cellularGateway.configure
