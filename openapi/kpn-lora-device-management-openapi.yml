      deprecated: false
  /connectivityPlans:
    get:
      tags:
      - Subscription
      summary: Retrieves connectivity plans
      description: Retrieves a list of connectivity plans existing within authorized scopes.
      operationId: Connectivityplansretrieval
      security:
        - oauth2: []
