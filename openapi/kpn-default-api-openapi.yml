        city:
          $ref: '#/components/schemas/city-schema'
    commentcode-schema_2:
      type: string
      maxLength: 80
      description: "Commentcodes are never blocking but meant to inform the WSO about certain situations.\n\nFollowing commentcodes are defined for Carrier Info requests:\n- The Requested phonenumber and numeric part of the zipcode is known, the alpha- part is not valid. KPN has provided the correct zipcode.\n- Address used in input is found. Planneduserinfo container has the technical address where the physical carrier (Copper/ISRA of Fiber termination-point) is delivered in de building\n- Numeric part zipcode valid and alphanumeric part zipcode invalid MDF Service ID is correct\n- Copper cannot be delivered, commentcode provides reason.\n- Fiber cannot be delivered, commentcode provides reason.\n- Advice to order with Test & Label\n- Address is complex address\n\nFollowing commentcodes are applicable for the technology availability. In some cases, it is necessary to (temporarily) limit the availability of a specific technology type, e.g. when EoF is not available for new connections (commentcode 9107) or when a technology type is closed for new connections (commentcode 9117).\n- 9107: EoF not available for new connections \n- 9117: Temporarily closed for new connections (automatically) \n- 9119: Vectoring safe mode. \n- 9792: Change line will result in change of Access Area\n\nFollowing commentcodes are applicable for carrier-vendor:\n- 9065: Bitrate measurement for xdf-service-ID not found \n- 9092: Provided fiber termination point id or Copper connection point number could not be found. \n- 9664: Technology is based on Technical address found for the address provided. \n- 9665: This distribution point is available based on partial address match \n- 9666: This distribution point is not available for all the connection points or Fiber termination points. \n- 9668: Complex address scenario identified \n- 9079: provided xdf-access-serviced not found \n- 9093: provided address does not match with xdf-access-serviceid related address \n- 9075: Address is unknown as copper address, but a valid non-network address. \n- 9076: invalid housenumber extension \n- 9702: Connection is planned \n- 9104: The network allows bonding as an NL2 order \n\nAn address can be on a No-Copper list for several reasons. Each reason can have a separate commentcode: \n- 9762: Location with third-party infrastructure \n- 9763: Location with specific complex local situation \n- 9764: Fiber-dedicated area \n- 9765: Only available via offer process \n- 9766: No passive access available (copper and fiber) \n\nAn address cannot be connected for several reasons. Each reason can have a separate commentcode. Refer to table below: \n- 9701: Passive Connect Status and reason code are both not available \n- 9702: Connection is plannend. \n- 9703: No permission from resident \n- 9707: High-rise obstruction (blocking other residents) \n- 9710: Utility cabinet is not according to standards \n- 9711: Building is empty \n- 9712: No excavation permit \n- 9713: Connection costs above standard amount are not covered \n- 9714: Outside of Roll out area \n- 9715: Fiber network belongs to another operator \n- 9716: No fiber capacity \n- 9717: No building \n- 9718: Building planned for demolition (fiber not prepared) \n- 9719: Building with one connection via another address \n- 9720: Contact person is not reachable (after multiple attempts). \n- 9721: Resident is not at home, will be planned later \n- 9722: Rollout after demand aggregation, resident did not request services \n- 9723: Will not be connected as part of this project although it resides within roll out \n- 9725: Ordering is possible as a result of HBO \n- 9731: Fiber on a roll to front of the house \n- 9732: FTU mounted, fibers patched, measured and ODF positions checked \n- 9734: Fiber on a roll at plot boundary \n- 9735: Duct (without fiber) in street. Status not allowed anymore \n- 9736: Mini-Duct (no fibers) in front of house \n- 9737: Mini-Duct (no fibers) until plot boundary \n- 9738: Mini-Duct in home (no fibers) \n- 9739: FTU mounted, fibers patched, measured and ODF positions checked (Packet front) \n- 9740: Fiber in house without FTU \n- 9742: Duct (no fiber) on tube end DB24. \n- 9743: Fiber finished on DP, no client fibers welded \n- 9744: Fibers in duct passed plot boundary \n- 9745: Fibers at front building high-rise (BGG) \n- 9746: Fiber on roll at front building high-rise (BGG) \n- 9747: Fiber mounted on DP present in high-rise building \n- 9748: Fiber mounted on DP below high-rise, no client fibers welded \n- 9749: Fiber on roll at plot boundary high-rise (BGG) \n- 9750: In phase of demand aggregation \n- 9751: Will never be connected \n- 9752: Connection is not prepared \n- 9762: Location with third-party infrastructure \n- 9763: Location with specific complex local situation \n- 9764: Fiber-dedicated area \n- 9765: Only available via offer process \n- 9766: No passive access available (copper and fiber\n"
      example: 9065
