      - wireless.configure
  /networks/{networkId}/wireless/ssids/{number}/vpn:
    get:
      description: List the VPN settings for the SSID.
      operationId: getNetworkWirelessSsidVpn
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: number
        in: path
        description: Number
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
              example:
                concentrator:
                  networkId: N_123
                  vlanId: 44
                  name: some concentrator name
                failover:
                  requestIp: 1.1.1.1
                  heartbeatInterval: 10
                  idleTimeout: 30
                splitTunnel:
                  enabled: true
                  rules:
                  - protocol: Any
                    destCidr: 1.1.1.1/32
                    destPort: any
                    policy: allow
                    comment: split tunnel rule 1
                  - destCidr: foo.com
                    destPort: any
                    policy: deny
                    comment: split tunnel rule 2
      summary: List the VPN settings for the SSID.
      tags:
      - wireless.configure
    put:
      description: Update the VPN settings for the SSID
      operationId: updateNetworkWirelessSsidVpn
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      - name: number
        in: path
        description: Number
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                concentrator:
                  type: object
                  properties:
                    networkId:
                      type: string
                      description: The NAT ID of the concentrator that should be set.
                    vlanId:
                      type: integer
                      description: The VLAN that should be tagged for the concentrator.
                  description: The VPN concentrator settings for this SSID.
                splitTunnel:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: If true, VPN split tunnel is enabled.
                    rules:
                      type: array
                      items:
                        type: object
                        properties:
                          protocol:
                            type: string
                            enum:
                            - Any
                            - TCP
                            - UDP
                            description: Protocol for this split tunnel rule.
                          destCidr:
                            type: string
                            description: Destination for this split tunnel rule. IP address, fully-qualified domain names (FQDN) or 'any'.
                          destPort:
                            type: string
                            description: Destination port for this split tunnel rule, (integer in the range 1-65535), or 'any'.
                          policy:
                            type: string
                            description: Traffic policy specified for this split tunnel rule, 'allow' or 'deny'.
                          comment:
                            type: string
                            description: Description for this split tunnel rule (optional).
                        required:
                        - destCidr
                        - policy
                      description: List of VPN split tunnel rules.
                  description: The VPN split tunnel settings for this SSID.
                failover:
                  type: object
                  properties:
                    requestIp:
                      type: string
                      description: IP addressed reserved on DHCP server where SSID will terminate.
                    heartbeatInterval:
                      type: integer
                      description: Idle timer interval in seconds.
                    idleTimeout:
                      type: integer
                      description: Idle timer timeout in seconds.
                  description: Secondary VPN concentrator settings. This is only used when two VPN concentrators are configured on the SSID.
              example:
                concentrator:
                  networkId: N_123
                  vlanId: 44
                  name: some concentrator name
                failover:
                  requestIp: 1.1.1.1
                  heartbeatInterval: 10
                  idleTimeout: 30
                splitTunnel:
                  enabled: true
                  rules:
                  - protocol: Any
                    destCidr: 1.1.1.1/32
                    destPort: any
                    policy: allow
                    comment: split tunnel rule 1
                  - destCidr: foo.com
                    destPort: any
                    policy: deny
                    comment: split tunnel rule 2
        required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
              example:
                concentrator:
                  networkId: N_123
                  vlanId: 44
                  name: some concentrator name
                failover:
                  requestIp: 1.1.1.1
                  heartbeatInterval: 10
                  idleTimeout: 30
                splitTunnel:
                  enabled: true
                  rules:
                  - protocol: Any
                    destCidr: 1.1.1.1/32
                    destPort: any
                    policy: allow
                    comment: split tunnel rule 1
                  - destCidr: foo.com
                    destPort: any
                    policy: deny
                    comment: split tunnel rule 2
      summary: Update the VPN settings for the SSID
      tags:
      - wireless.configure
