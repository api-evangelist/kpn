  /networks/{networkId}/wireless/settings:
    get:
      description: Return the wireless settings for a network
      operationId: getNetworkWirelessSettings
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  meshingEnabled:
                    type: boolean
                    description: Toggle for enabling or disabling meshing in a network
                  ipv6BridgeEnabled:
                    type: boolean
                    description: 'Toggle for enabling or disabling IPv6 bridging in a network (Note: if enabled, SSIDs must also be configured to use bridge mode)'
                  locationAnalyticsEnabled:
                    type: boolean
                    description: Toggle for enabling or disabling location analytics for your network
                  upgradeStrategy:
                    type: string
                    enum:
                    - minimizeClientDowntime
                    - minimizeUpgradeTime
                    description: The default strategy that network devices will use to perform an upgrade. Requires firmware version MR 26.8 or higher.
                  ledLightsOn:
                    type: boolean
                    description: Toggle for enabling or disabling LED lights on all APs in the network (making them run dark)
                  namedVlans:
                    type: object
                    properties:
                      poolDhcpMonitoring:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            description: Whether or not devices using named VLAN pools should remove dirty VLANs from the pool, thereby preventing clients from being assigned to VLANs where they would be unable to obtain an IP address via DHCP
                          duration:
                            type: integer
                            description: The duration in minutes that devices will refrain from using dirty VLANs before adding them back to the pool.
                        description: Named VLAN Pool DHCP Monitoring settings.
                    description: Named VLAN settings for wireless networks.
                  regulatoryDomain:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the regulatory domain for this network.
                      countryCode:
                        type: string
                        description: The country code of the regulatory domain.
                      permits6e:
                        type: boolean
                        description: Whether or not the regulatory domain for this network permits Wifi 6E.
                    description: Regulatory domain information for this network.
              example:
                meshingEnabled: true
                ipv6BridgeEnabled: false
                locationAnalyticsEnabled: false
                upgradeStrategy: minimizeUpgradeTime
                ledLightsOn: false
                namedVlans:
                  poolDhcpMonitoring:
                    enabled: true
                    duration: 5
                regulatoryDomain:
                  name: FCC
                  countryCode: US
                  permits6e: true
      summary: Return the wireless settings for a network
      tags:
      - wireless.configure
    put:
      description: Update the wireless settings for a network
      operationId: updateNetworkWirelessSettings
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                meshingEnabled:
                  type: boolean
                  description: Toggle for enabling or disabling meshing in a network
                ipv6BridgeEnabled:
                  type: boolean
                  description: 'Toggle for enabling or disabling IPv6 bridging in a network (Note: if enabled, SSIDs must also be configured to use bridge mode)'
                locationAnalyticsEnabled:
                  type: boolean
                  description: Toggle for enabling or disabling location analytics for your network
                upgradeStrategy:
                  type: string
                  enum:
                  - minimizeClientDowntime
                  - minimizeUpgradeTime
                  description: The default strategy that network devices will use to perform an upgrade. Requires firmware version MR 26.8 or higher.
                ledLightsOn:
                  type: boolean
                  description: Toggle for enabling or disabling LED lights on all APs in the network (making them run dark)
                namedVlans:
                  type: object
                  properties:
                    poolDhcpMonitoring:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Whether or not devices using named VLAN pools should remove dirty VLANs from the pool, thereby preventing clients from being assigned to VLANs where they would be unable to obtain an IP address via DHCP.
                        duration:
                          type: integer
                          description: The duration in minutes that devices will refrain from using dirty VLANs before adding them back to the pool.
                      description: Named VLAN Pool DHCP Monitoring settings.
                  description: Named VLAN settings for wireless networks.
              example:
                meshingEnabled: true
                ipv6BridgeEnabled: false
                locationAnalyticsEnabled: false
                upgradeStrategy: minimizeUpgradeTime
                ledLightsOn: false
                namedVlans:
                  poolDhcpMonitoring:
                    enabled: true
                    duration: 5
        required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  meshingEnabled:
                    type: boolean
                    description: Toggle for enabling or disabling meshing in a network
                  ipv6BridgeEnabled:
                    type: boolean
                    description: 'Toggle for enabling or disabling IPv6 bridging in a network (Note: if enabled, SSIDs must also be configured to use bridge mode)'
                  locationAnalyticsEnabled:
                    type: boolean
                    description: Toggle for enabling or disabling location analytics for your network
                  upgradeStrategy:
                    type: string
                    enum:
                    - minimizeClientDowntime
                    - minimizeUpgradeTime
                    description: The default strategy that network devices will use to perform an upgrade. Requires firmware version MR 26.8 or higher.
                  ledLightsOn:
                    type: boolean
                    description: Toggle for enabling or disabling LED lights on all APs in the network (making them run dark)
                  namedVlans:
                    type: object
                    properties:
                      poolDhcpMonitoring:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            description: Whether or not devices using named VLAN pools should remove dirty VLANs from the pool, thereby preventing clients from being assigned to VLANs where they would be unable to obtain an IP address via DHCP
                          duration:
                            type: integer
                            description: The duration in minutes that devices will refrain from using dirty VLANs before adding them back to the pool.
                        description: Named VLAN Pool DHCP Monitoring settings.
                    description: Named VLAN settings for wireless networks.
                  regulatoryDomain:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the regulatory domain for this network.
                      countryCode:
                        type: string
                        description: The country code of the regulatory domain.
                      permits6e:
                        type: boolean
                        description: Whether or not the regulatory domain for this network permits Wifi 6E.
                    description: Regulatory domain information for this network.
              example:
                meshingEnabled: true
                ipv6BridgeEnabled: false
                locationAnalyticsEnabled: false
                upgradeStrategy: minimizeUpgradeTime
                ledLightsOn: false
                namedVlans:
                  poolDhcpMonitoring:
                    enabled: true
                    duration: 5
                regulatoryDomain:
                  name: FCC
                  countryCode: US
