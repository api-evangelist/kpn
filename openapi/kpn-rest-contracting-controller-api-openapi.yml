        required: false
        schema:
          type: string
          enum:
          - PRODUCT_NAME
          - CATEGORY
          - FOLDER_NAME
          - PRICE_IN_CENTS
          - PRIVATE_COPYING_LEVY_IN_CENTS
      - name: to
        in: query
        description: Pagination parameter - end element (exluded). Default value is 20.
        required: false
        x-example: 20
        schema:
          type: integer
          format: int32
      responses:
