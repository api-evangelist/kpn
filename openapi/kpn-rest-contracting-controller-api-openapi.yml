  /contracting/basket/main-products:
    get:
      tags:
      - rest-contracting-controller
      summary: Get list of main products to order
      description: 'Required privileges (one of the following):


        privileges_un-authorized_orders_creation


        privileges_orders_authorization'
      operationId: getMainProductsUsingGET
      parameters:
      - name: Content-Language
        in: header
        description: Content-Language
        required: false
        schema:
          type: string
      - name: category
        in: query
        description: 'Possible values: MOBILE, SIM CARDS, FIXED, HARDWARE, SOFTWARE, OTHER'
        required: false
        schema:
          type: string
      - name: filters
        in: query
        description: 'Possible columns: PRODUCT_NAME, PRICE_IN_CENTS, PRIVATE_COPYING_LEVY_IN_CENTS. For example: STATUS: "a", "b"; PRICE_IN_CENTS: "1", "2"'
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: Pagination parameter - start from (included). The elements are counted from 0. Default value is 0.
        required: false
        x-example: 0
        schema:
          type: integer
          format: int32
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: patterns
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: sessionId
        in: query
        description: sessionId
        required: false
        schema:
          type: string
      - name: sortBy
