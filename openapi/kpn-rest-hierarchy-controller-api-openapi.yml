components:
  schemas:
    CostCenterDetails:
      type: object
      properties:
        number:
          type: string
      title: CostCenterDetails
    CreateVirtualGroupRequestParams:
      type: object
      properties:
        groupId:
          type: integer
          format: int64
        name:
          type: string
      title: CreateVirtualGroupRequestParams
    HierarchyItemDetails:
      type: object
      properties:
        businessLocation:
          $ref: '#/components/schemas/BusinessLocationDetails'
        costCenter:
          $ref: '#/components/schemas/CostCenterDetails'
        customer:
          $ref: '#/components/schemas/CustomerDetails'
        debtor:
          $ref: '#/components/schemas/DebtorDetails'
        name:
          type: string
        path:
          type: array
          items:
            $ref: '#/components/schemas/VirtualHierarchyItem'
      title: HierarchyItemDetails
    DebtorDetails:
      type: object
      properties:
        activeFrom:
          type: string
          format: date-time
        additionalInvoiceLayuot:
          type: string
          enum:
          - CSV
          - XML
        appleDepId:
          type: string
        billingAddress:
          $ref: '#/components/schemas/LocationAddress'
        inviceFlag:
          type: boolean
        invoiceDistribution:
          type: string
          enum:
          - MAIL
          - EMAIL
          - EINVOICE
        invoiceLanguage:
          type: string
          enum:
          - EN
          - NL
        krnNumber:
          type: string
        primaryAddress:
          $ref: '#/components/schemas/LocationAddress'
        primaryEmail:
          type: string
        samsungKnoxId:
          type: string
      title: DebtorDetails
    CreateCostCenterRequestParams:
      type: object
      properties:
        costCenterNumber:
          type: string
        groupId:
          type: integer
          format: int64
        name:
          type: string
      title: CreateCostCenterRequestParams
    OperationState:
      type: object
      properties:
        blocked:
          type: boolean
        blockingOrders:
          type: array
          items:
            $ref: '#/components/schemas/BlockingOrder'
        reason:
          type: string
      title: OperationState
    LocationAddress:
      type: object
      properties:
        attention:
          type: string
        city:
          type: string
        country:
          type: string
        floor:
          type: string
        houseNumber:
          type: string
        location:
          type: string
        partyName:
          type: string
        poBoxNumber:
          type: string
        postalCode:
          type: string
        room:
          type: string
        street:
          type: string
      title: LocationAddress
    BusinessLocationDetails:
      type: object
      properties:
        activeFrom:
          type: string
          format: date-time
        activeTo:
          type: string
          format: date-time
        contactEmail:
          type: string
        contactName:
          type: string
        contactPhoneNumber:
          type: string
        expectedNumberOfUsers:
          type: integer
          format: int64
        externalAccountNumber:
          type: string
        primaryAddress:
          $ref: '#/components/schemas/LocationAddress'
      title: BusinessLocationDetails
    CreatedOrder:
      type: object
      properties:
        contextName:
          type: string
        id:
          type: integer
          format: int64
        operation:
          type: string
      title: CreatedOrder
    ErrorResponse:
      type: object
      properties:
