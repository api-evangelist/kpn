  /hierarchy/children/{id}/remove:
    post:
      tags:
      - rest-hierarchy-controller
      summary: Remove hierarchy entity (cost center, custom group)
      description: 'Remove custom group or cost center data. The underlying end users and organizational units will be moved to the next highest item in the organizational structure.

        The request is validated. Possible validation errors:

        | HTTP code | Error code | Description |

        |-----------|------------------------------------|--------------------------------------------------------------|

        | `400` | `WRONG_GROUP_TYPE` | Only custom group and cost center data can be modified |

        | `404` | `VIRTUAL_HIERARCHY_ITEM_NOT_FOUND` | Hierarchy group with given `id` can not be found |

        | `400` | `FORBIDDEN_PATH_WHEN_REMOVING` | Entity cannot be removed because that will cause error in items hierarchy. Exception is thrown when path in hierarchy is: ... -> CUSTOM_GROUP -> COST_CENTER -> CUSTOM_GROUP ... -> and user try to remove COST_CENTER. CUSTOM_GROUP cannot be under CUSTOM_GROUP. |

        Required privileges (one of the following):


        privileges_un-authorized_orders_creation


        privileges_orders_authorization


        privileges_virtual_hierarchy_management


        privileges_bulk_upload_data_of_end_user'
      operationId: removeGroupUsingPOST
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
        '400':
