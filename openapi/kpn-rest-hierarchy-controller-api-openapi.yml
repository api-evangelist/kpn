        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
    post:
      tags:
      - rest-hierarchy-controller
      summary: Update hierarchy entity (cost center, custom group)
      description: 'Change custom group or cost center data

        The request is validated. Possible validation errors:

        | HTTP code | Error code | Description |

        |-----------|------------------------------------|--------------------------------------------------------------|

        | `400` | `WRONG_GROUP_TYPE` | Only custom group and cost center data can be modified |

        | `400` | `VALUE_REQUIRED` | `costCenterNumber` field is required for cost center |

        | `400` | `VALUE_NOT_UNIQUE` | `costCenterNumber` field must be unique within the customer |

        | `404` | `VIRTUAL_HIERARCHY_ITEM_NOT_FOUND` | Hierarchy group with given `id` can not be found |

        Required privileges (one of the following):


        privileges_un-authorized_orders_creation


        privileges_orders_authorization


        privileges_virtual_hierarchy_management


        privileges_bulk_upload_data_of_end_user'
      operationId: updateChildUsingPOST
