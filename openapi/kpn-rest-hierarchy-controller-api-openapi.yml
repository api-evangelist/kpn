        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
  /hierarchy/children/virtual-group:
    post:
      tags:
      - rest-hierarchy-controller
      summary: Create virtual group
      description: 'Create new virtual group

        The request is validated. Possible validation errors:

        | HTTP code | Error code | Description |

        |-----------|------------------------------------|------------------------------------------------------------|

        | `400` | `WRONG_GROUP_TYPE` | Cannot create virtual group as a child of given group type |

        | `404` | `VIRTUAL_HIERARCHY_ITEM_NOT_FOUND` | Hierarchy group with given `id` can not be found |

        Required privileges (one of the following):


        privileges_un-authorized_orders_creation


        privileges_orders_authorization


        privileges_virtual_hierarchy_management


        privileges_bulk_upload_data_of_end_user'
      operationId: createVirtualGroupUsingPOST
      responses:
        '200':
          description: OK
