info:
  description: '### Key highlights

    - **Sandbox:** Full-fledged capabilities.

    - **Security:** HTTPS, OAuth, Rate limit

    - **Versioning:** supports version-less API, version tight. If no version is provided (in header) it defaults to latest version.


    ## Source view

    Documentation view

    ---

    ## KPN API Store

    Getting Started


    ---'
  version: v1
  title: ISE - KPN Endpoint API
  contact:
    name: API Support
    email: api_developer@kpn.com
    url: https://developer.kpn.com/support
  termsOfService: https://developer.kpn.com/legal
servers:
- url: https://api-prd.kpn.com/kpn/ise
tags:
- name: Endpoint
paths:
  /endpoint/:
    get:
      tags:
      - Endpoint
      description: Get endpoints within group using the endpointgroup id.
      security:
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/api_version'
      - $ref: '#/components/parameters/filter'
      responses:
        200:
          $ref: '#/components/responses/endpointgroup'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        429:
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      summary: Get endpoint
      x-summary-source: derived
      operationId: getEndpoint
      x-operation-id-source: derived
  /endpoint/name/{name}:
    get:
      tags:
      - Endpoint
      description: Get endpoints within group using the endpointgroup id.
      security:
      - oauth2: []
      parameters:
