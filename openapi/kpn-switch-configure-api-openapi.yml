                        type: integer
                        description: OSPF Cost
                      isPassiveEnabled:
                        type: boolean
                        description: Disable sending Hello packets on this interface's IPv4 area
                    description: IPv4 OSPF Settings
                  ospfV3:
                    type: object
                    properties:
                      area:
                        type: string
                        description: Area id
                      cost:
                        type: integer
                        description: OSPF Cost
                      isPassiveEnabled:
                        type: boolean
                        description: Disable sending Hello packets on this interface's IPv6 area
                    description: IPv6 OSPF Settings
                  ipv6:
                    type: object
                    properties:
                      assignmentMode:
                        type: string
                        description: Assignment mode
                      address:
                        type: string
                        description: IPv6 address
                      prefix:
                        type: string
                        description: IPv6 subnet
                      gateway:
                        type: string
                        description: IPv6 gateway
                    description: IPv6 addressing
                  defaultGateway:
                    type: string
                    description: IPv4 default gateway
              example:
                interfaceId: '1234'
                name: L3 interface
                subnet: 192.168.1.0/24
                interfaceIp: 192.168.1.2
                multicastRouting: disabled
                vlanId: 100
                ospfSettings:
                  area: '0'
                  cost: 1
                  isPassiveEnabled: true
                ospfV3:
                  area: '1'
                  cost: 2
                  isPassiveEnabled: true
                ipv6:
                  assignmentMode: static
                  address: 1:2:3:4::1
                  prefix: 1:2:3:4::/48
                  gateway: 1:2:3:4::2
                defaultGateway: 192.168.1.1
      summary: Create a layer 3 interface for a switch stack
      tags:
      - switch.configure
