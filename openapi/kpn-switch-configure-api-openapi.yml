                ipv6:
                  assignmentMode: static
                  prefix: 1:2:3:4::/48
                  address: 1:2:3:4::1
                  gateway: 1:2:3:4::2
              required:
              - name
              - vlanId
        required: true
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  interfaceId:
                    type: string
                    description: The id
                  name:
                    type: string
                    description: The name
                  subnet:
                    type: string
                    description: IPv4 subnet
                  interfaceIp:
                    type: string
