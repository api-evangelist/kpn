                                - AWS
                                - Box
                                - Office 365 Sharepoint
                                - Office 365 Suite
                                - Oracle
                                - SAP
                                - Salesforce
                                - Skype & Teams
                                - Slack
                                - Webex
                                - Webex Calling
                                - Webex Meetings
                                - Zoom
                                description: Application's name.
                            required:
                            - id
                            - name
                          description: Major Application based VPN exclusion rules.
