  /networks/{networkId}/appliance/trafficShaping/vpnExclusions:
    put:
      description: Update VPN exclusion rules for an MX network.
      operationId: updateNetworkApplianceTrafficShapingVpnExclusions
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                custom:
                  type: array
                  items:
                    type: object
                    properties:
                      protocol:
                        type: string
                        enum:
                        - any
                        - dns
                        - icmp
                        - tcp
                        - udp
                        description: Protocol.
                      destination:
                        type: string
                        description: Destination address; hostname required for DNS, IPv4 otherwise.
                      port:
                        type: string
                        description: Destination port.
                    required:
                    - protocol
                  description: Custom VPN exclusion rules. Pass an empty array to clear existing rules.
                majorApplications:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Application's Meraki ID.
                      name:
                        type: string
                        enum:
                        - AWS
                        - Box
                        - Office 365 Sharepoint
                        - Office 365 Suite
                        - Oracle
                        - SAP
                        - Salesforce
                        - Skype & Teams
                        - Slack
                        - Webex
                        - Webex Calling
                        - Webex Meetings
                        - Zoom
                        description: Application's name.
                    required:
                    - id
                  description: Major Application based VPN exclusion rules. Pass an empty array to clear existing rules.
              example:
                custom:
                - protocol: tcp
                  destination: 192.168.3.0/24
                  port: '8000'
                majorApplications:
                - id: meraki:vpnExclusion/application/2
                  name: Office 365 Sharepoint
        required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  networkId:
                    type: string
                    description: ID of the network whose VPN exclusion rules are returned.
                  networkName:
                    type: string
                    description: Name of the network whose VPN exclusion rules are returned.
                  custom:
                    type: array
                    items:
                      type: object
                      properties:
                        protocol:
                          type: string
                          enum:
                          - any
                          - dns
                          - icmp
                          - tcp
                          - udp
                          description: Protocol.
                        destination:
                          type: string
                          description: Destination address; hostname required for DNS, IPv4 otherwise.
                        port:
                          type: string
                          description: Destination port.
                      required:
                      - protocol
                      - destination
                      - port
                    description: Custom VPN exclusion rules.
                  majorApplications:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Application's Meraki ID.
                        name:
                          type: string
                          enum:
                          - AWS
                          - Box
                          - Office 365 Sharepoint
                          - Office 365 Suite
                          - Oracle
                          - SAP
                          - Salesforce
                          - Skype & Teams
                          - Slack
                          - Webex
                          - Webex Calling
                          - Webex Meetings
                          - Zoom
                          description: Application's name.
                      required:
                      - id
                      - name
                    description: Major Application based VPN exclusion rules.
                required:
                - networkId
                - networkName
                - custom
                - majorApplications
              example:
                networkId: N_24329156
                networkName: Main Office
                custom:
                - protocol: tcp
                  destination: 192.168.3.0/24
                  port: '8000'
                majorApplications:
                - id: meraki:vpnExclusion/application/2
                  name: Office 365 Sharepoint
      summary: Update VPN exclusion rules for an MX network.
      tags:
      - appliance.configure
  /networks/{networkId}/appliance/vlans:
