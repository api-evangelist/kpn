  /networks/{networkId}/appliance/vpn/bgp:
    get:
      description: Return a Hub BGP Configuration
      operationId: getNetworkApplianceVpnBgp
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether BGP is enabled on the appliance
                  asNumber:
                    type: integer
                    description: The number of the Autonomous System to which the appliance belongs
                  ibgpHoldTimer:
                    type: integer
                    description: The iBGP hold time in seconds
                  neighbors:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                          description: The IPv4 address of the neighbor
                        ipv6:
                          type: object
                          properties:
                            address:
                              type: string
                              description: The IPv6 address of the neighbor
                          description: Information regarding IPv6 address of the neighbor
                        remoteAsNumber:
                          type: integer
                          description: Remote AS number of the neighbor
                        receiveLimit:
                          type: integer
                          description: The maximum number of routes that the appliance can receive from the neighbor
                        allowTransit:
                          type: boolean
                          description: Whether the appliance will advertise routes learned from other Autonomous Systems
                        ebgpHoldTimer:
                          type: integer
                          description: The eBGP hold time in seconds for the neighbor
                        ebgpMultihop:
                          type: integer
                          description: The number of hops the appliance must traverse to establish a peering relationship with the neighbor
                        sourceInterface:
                          type: string
                          description: The output interface the appliance uses to establish a peering relationship with the neighbor
                        nextHopIp:
                          type: string
                          description: The IPv4 address of the neighbor that will establish a TCP session with the appliance
                        ttlSecurity:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether BGP TTL security is enabled
                          description: Settings for BGP TTL security to protect BGP peering sessions from forged IP attacks
                        authentication:
                          type: object
                          properties:
                            password:
                              type: string
                              description: Password to configure MD5 authentication between BGP peers
                          description: Authentication settings between BGP peers
                    description: List of eBGP neighbor configurations
              example:
                enabled: true
                asNumber: 64515
                ibgpHoldTimer: 120
                neighbors:
                - ip: 10.10.10.22
                  ipv6:
                    address: 2002::1234:abcd:ffff:c0a8:101
                  remoteAsNumber: 64343
                  receiveLimit: 120
                  allowTransit: true
                  ebgpHoldTimer: 180
                  ebgpMultihop: 2
                  sourceInterface: wan1
                  nextHopIp: 1.2.3.4
                  ttlSecurity:
                    enabled: false
                  authentication:
                    password: abc123
      summary: Return a Hub BGP Configuration
      tags:
      - appliance.configure
    put:
      description: Update a Hub BGP Configuration
      operationId: updateNetworkApplianceVpnBgp
      parameters:
      - name: networkId
        in: path
        description: Network ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Boolean value to enable or disable the BGP configuration. When BGP is enabled, the asNumber (ASN) will be autopopulated with the preconfigured ASN at other Hubs or a default value if there is no ASN configured.
                asNumber:
                  type: integer
                  description: An Autonomous System Number (ASN) is required if you are to run BGP and peer with another BGP Speaker outside of the Auto VPN domain. This ASN will be applied to the entire Auto VPN domain. The entire 4-byte ASN range is supported. So, the ASN must be an integer between 1 and 4294967295. When absent, this field is not updated. If no value exists then it defaults to 64512.
                ibgpHoldTimer:
                  type: integer
                  description: The iBGP holdtimer in seconds. The iBGP holdtimer must be an integer between 12 and 240. When absent, this field is not updated. If no value exists then it defaults to 240.
                neighbors:
                  type: array
                  items:
                    type: object
                    properties:
                      ip:
                        type: string
                        description: The IPv4 address of the neighbor
                      ipv6:
                        type: object
                        properties:
                          address:
                            type: string
                            description: The IPv6 address of the neighbor.
                        required:
                        - address
                        description: Information regarding IPv6 address of the neighbor, Required if `ip` is not present.
                      remoteAsNumber:
                        type: integer
                        description: Remote ASN of the neighbor. The remote ASN must be an integer between 1 and 4294967295.
                      receiveLimit:
                        type: integer
                        description: The receive limit is the maximum number of routes that can be received from any BGP peer. The receive limit must be an integer between 0 and 2147483647. When absent, it defaults to 0.
                      allowTransit:
                        type: boolean
                        description: When this feature is on, the Meraki device will advertise routes learned from other Autonomous Systems, thereby allowing traffic between Autonomous Systems to transit this AS. When absent, it defaults to false.
                      ebgpHoldTimer:
                        type: integer
                        description: The eBGP hold timer in seconds for each neighbor. The eBGP hold timer must be an integer between 12 and 240.
                      ebgpMultihop:
                        type: integer
                        description: Configure this if the neighbor is not adjacent. The eBGP multi-hop must be an integer between 1 and 255.
                      sourceInterface:
                        type: string
                        description: 'The output interface for peering with the remote BGP peer. Valid values are: ''wan1'', ''wan2'' or ''vlan{VLAN ID}''(e.g. ''vlan123'').'
                      nextHopIp:
                        type: string
                        description: The IPv4 address of the remote BGP peer that will establish a TCP session with the local MX.
                      ttlSecurity:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            description: Boolean value to enable or disable BGP TTL security.
                        description: Settings for BGP TTL security to protect BGP peering sessions from forged IP attacks.
                      authentication:
                        type: object
                        properties:
                          password:
                            type: string
                            description: Password to configure MD5 authentication between BGP peers.
                        description: Authentication settings between BGP peers.
                    required:
                    - remoteAsNumber
                    - ebgpHoldTimer
                    - ebgpMultihop
                  description: List of BGP neighbors. This list replaces the existing set of neighbors. When absent, this field is not updated.
              example:
                enabled: true
                asNumber: 64515
                ibgpHoldTimer: 120
                neighbors:
                - ip: 10.10.10.22
                  ipv6:
                    address: 2002::1234:abcd:ffff:c0a8:101
                  remoteAsNumber: 64343
                  receiveLimit: 120
                  allowTransit: true
                  ebgpHoldTimer: 180
                  ebgpMultihop: 2
                  sourceInterface: wan1
                  nextHopIp: 1.2.3.4
                  ttlSecurity:
                    enabled: false
                  authentication:
                    password: abc123
              required:
              - enabled
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether BGP is enabled on the appliance
                  asNumber:
                    type: integer
                    description: The number of the Autonomous System to which the appliance belongs
                  ibgpHoldTimer:
                    type: integer
                    description: The iBGP hold time in seconds
                  neighbors:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                          description: The IPv4 address of the neighbor
                        ipv6:
                          type: object
                          properties:
                            address:
                              type: string
                              description: The IPv6 address of the neighbor
                          description: Information regarding IPv6 address of the neighbor
                        remoteAsNumber:
                          type: integer
                          description: Remote AS number of the neighbor
                        receiveLimit:
                          type: integer
                          description: The maximum number of routes that the appliance can receive from the neighbor
                        allowTransit:
                          type: boolean
                          description: Whether the appliance will advertise routes learned from other Autonomous Systems
                        ebgpHoldTimer:
                          type: integer
                          description: The eBGP hold time in seconds for the neighbor
                        ebgpMultihop:
                          type: integer
                          description: The number of hops the appliance must traverse to establish a peering relationship with the neighbor
                        sourceInterface:
                          type: string
                          description: The output interface the appliance uses to establish a peering relationship with the neighbor
                        nextHopIp:
                          type: string
                          description: The IPv4 address of the neighbor that will establish a TCP session with the appliance
                        ttlSecurity:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              description: Whether BGP TTL security is enabled
                          description: Settings for BGP TTL security to protect BGP peering sessions from forged IP attacks
                        authentication:
                          type: object
                          properties:
                            password:
                              type: string
                              description: Password to configure MD5 authentication between BGP peers
                          description: Authentication settings between BGP peers
                    description: List of eBGP neighbor configurations
              example:
                enabled: true
                asNumber: 64515
                ibgpHoldTimer: 120
                neighbors:
                - ip: 10.10.10.22
                  ipv6:
                    address: 2002::1234:abcd:ffff:c0a8:101
                  remoteAsNumber: 64343
                  receiveLimit: 120
                  allowTransit: true
                  ebgpHoldTimer: 180
                  ebgpMultihop: 2
                  sourceInterface: wan1
                  nextHopIp: 1.2.3.4
                  ttlSecurity:
                    enabled: false
                  authentication:
                    password: abc123
      summary: Update a Hub BGP Configuration
