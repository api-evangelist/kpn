                    name: My favorite IP
                reservedIpRanges:
                - start: 192.168.1.0
                  end: 192.168.1.1
                  comment: A reserved IP range
                dnsNameservers: google_dns
                dhcpOptions:
                - code: '5'
                  type: text
                  value: five
                vpnNatSubnet: 192.168.1.0/24
                mandatoryDhcp:
                  enabled: true
                ipv6:
                  enabled: true
                  prefixAssignments:
                  - autonomous: false
                    staticPrefix: 2001:db8:3c4d:15::/64
                    staticApplianceIp6: 2001:db8:3c4d:15::1
                    origin:
                      type: internet
                      interfaces:
                      - wan0
