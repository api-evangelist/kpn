                        vlan: 10
                        host: 254
                        fqdn: www.google.com
                  preferredUplink: bestForVoIP
                  failOverCriterion: poorPerformance
                  performanceClass:
                    type: custom
                    builtinPerformanceClassName: VoIP
                    customPerformanceClassId: '123456'
