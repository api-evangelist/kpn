  /track-and-trace/orders/{id}/porting-data:
    post:
      tags:
      - rest-track-and-trace-controller
      summary: Change port in date or customer number
      description: 'Endpoint allows to change both : customer number and wish date in one request or change only one parameter.

        There are several possibility to set data:

        | newWishDate | asap | customerNumber | result |

        |-------------|--------|----------------|-------------------------------------|

        | date | false | null | change only wish date |

        | null | true | null | change only wish date to ASAP |

        | null | true | number | change customer number and wishDate |

        | date | false | number | change customer number and wishDate |

        | date | true | * | validation error |

        | null | false | null | validation error |


        Required privileges (one of the following):


        privileges_orders_track_and_trace


        privileges_orders_authorization'
      operationId: changePortingDataUsingPOST
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePortingData'
        description: data
        required: true
