paths:
  /track-and-trace/orders:
    get:
      tags:
      - rest-track-and-trace-controller
      summary: Get order list
      description: 'Required privileges (one of the following):


        privileges_orders_track_and_trace


        privileges_orders_authorization'
      operationId: getOrdersUsingGET
      parameters:
      - name: currentUserOrdersOnly
        in: query
        required: false
        x-example: false
        schema:
          type: boolean
          default: false
      - name: from
        in: query
        description: Pagination parameter - start from (included). The elements are counted from 0. Default value is 0.
        required: false
        x-example: 0
        schema:
          type: integer
          format: int32
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: patterns
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATION_DATE
          - STATUS
          - KPN_REFERENCE
          - ORDERED_FOR
          - CUSTOMER_REFERENCE
      - name: status
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - IN_PROGRESS
            - UNAUTHORIZED
            - NEW
            - CLOSED
            - CANCELED
            - REJECTED
            - DRAFT
            - THIRD_PARTY
            - HOLD_CUSTOMER
            - WAITING
      - name: to
        in: query
        description: Pagination parameter - end element (exluded). Default value is 20.
        required: false
        x-example: 20
        schema:
          type: integer
          format: int32
      - name: withRequiredActionFirst
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PagedResult_Order_'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
