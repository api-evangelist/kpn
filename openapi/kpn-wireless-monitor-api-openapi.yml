      - name: ssid
        in: query
        description: Filter results by SSID
        schema:
          type: integer
      - name: vlan
        in: query
        description: Filter results by VLAN
        schema:
          type: integer
      - name: apTag
        in: query
        description: Filter results by AP Tag
        schema:
          type: string
      - name: fields
