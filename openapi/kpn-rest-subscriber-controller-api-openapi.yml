components:
  schemas:
    BlockingOrder:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kpnReference:
          type: string
        status:
          type: string
          enum:
          - IN_PROGRESS
          - UNAUTHORIZED
          - NEW
          - CLOSED
          - CANCELED
          - REJECTED
          - DRAFT
          - THIRD_PARTY
          - HOLD_CUSTOMER
          - WAITING
        type:
          type: string
          enum:
          - CONTRACTING
          - SERVICE_REQUEST
      title: BlockingOrder
    UpdateSubscriberRequestParams:
      type: object
      properties:
        referenceNumber:
          type: string
        subscriber:
          $ref: '#/components/schemas/SubscriberDetailsRequestParams'
      title: UpdateSubscriberRequestParams
    PagedResult_Subscriber_:
      type: object
      properties:
        result:
          type: array
          description: One page of result
          items:
            $ref: '#/components/schemas/Subscriber'
        total:
          type: integer
          format: int32
          description: Total number of all elements in collection
      title: PagedResult_Subscriber_
      description: Paged list of elements
    MoveSubscriberRequestParams:
      type: object
      properties:
        destinationGroupId:
          type: integer
          format: int64
        referenceNumber:
          type: string
        wishDate:
          type: string
          format: date-time
      title: MoveSubscriberRequestParams
    VirtualHierarchyItem:
      type: object
      properties:
        costCenterNumber:
          type: string
        email:
          type: string
        employeeNumber:
          type: string
        firstName:
          type: string
        id:
          type: integer
          format: int64
        lastName:
          type: string
        name:
          type: string
        operation:
          $ref: '#/components/schemas/OperationState'
        path:
          type: array
          items:
            $ref: '#/components/schemas/VirtualHierarchyItem'
        prefix:
          type: string
        type:
          type: string
          enum:
          - CUSTOMER
          - DEBTOR
          - SUBSCRIBER
          - COST_CENTER
          - CUSTOM_GROUP
          - BUSINESS_LOCATION
      title: VirtualHierarchyItem
    ErrorResponse:
      type: object
      properties:
        transactionId:
          type: string
          description: transaction id of the the request
          title: Transaction ID
        status:
          type: string
          description: Status
          title: Status
        name:
          type: string
          description: Error name
          title: Error name
        message:
          type: string
          description: Error message
          title: Error message
        info:
          type: string
          description: Additional information about error
          title: Info
    OperationState:
      type: object
      properties:
        blocked:
          type: boolean
        blockingOrders:
          type: array
          items:
            $ref: '#/components/schemas/BlockingOrder'
        reason:
          type: string
      title: OperationState
    SubscriberOperationsAvailability:
      type: object
      properties:
        editable:
          $ref: '#/components/schemas/OperationEnabled'
        movable:
          $ref: '#/components/schemas/OperationEnabled'
        removable:
          $ref: '#/components/schemas/OperationEnabled'
        rolesEditable:
          $ref: '#/components/schemas/OperationEnabled'
      title: SubscriberOperationsAvailability
    LocalizedString:
      type: object
      properties:
        en:
          type: string
          description: English version
        nl:
          type: string
          description: Dutch version
      title: LocalizedString
      description: Text with two language versions
    SubscriberDetailsRequestParams:
      type: object
      required:
      - surname
      properties:
        comments:
          type: string
          minLength: 0
          maxLength: 4000
        email:
          type: string
        employeeNumber:
          type: string
          minLength: 0
          maxLength: 100
        firstName:
          type: string
          minLength: 0
          maxLength: 100
        fixedNumber:
          type: string
          description: Should apply to format 31XXXYYYZZZ or 0XXXYYYZZZ
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
        mobileNumber:
          type: string
          description: Should apply to format 316XXXYYYZZ or 06XXXYYYZZ
        preferredLanguage:
          type: string
          enum:
          - EN
          - NL
        surname:
          type: string
          minLength: 1
          maxLength: 100
        surnamePrefix:
          type: string
          minLength: 0
          maxLength: 32
        vip:
          type: boolean
      title: SubscriberDetailsRequestParams
    SubscriberContracts:
      type: object
      properties:
        amount:
          type: integer
          format: int32
        firstPhoneNumber:
          type: string
      title: SubscriberContracts
    SubscriberDetails:
      type: object
      properties:
        comments:
          type: string
        email:
          type: string
        employeeNumber:
          type: string
        firstName:
          type: string
        fixedNumber:
          type: string
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
        gripUser:
          type: boolean
        id:
          type: integer
          format: int64
        location:
          type: array
          items:
            type: string
        mobileNumber:
          type: string
        path:
          type: array
          items:
            $ref: '#/components/schemas/VirtualHierarchyItem'
        preferredLanguage:
          type: string
          enum:
          - EN
          - NL
        surname:
          type: string
        surnamePrefix:
          type: string
        user:
          type: boolean
        vip:
          type: boolean
      title: SubscriberDetails
    Contract:
      type: object
      properties:
        category:
          type: string
        extension:
          type: string
